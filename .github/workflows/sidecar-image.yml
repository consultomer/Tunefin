# Publishes the sidecar as a ready-made image, so users don't have to clone and build it:
#
#   ghcr.io/<owner>/tunefin-sidecar:<version>   e.g. 1.0.2 for tag v1.0.2
#   ghcr.io/<owner>/tunefin-sidecar:latest
#
# Runs on every version tag, and once a week rebuilds the latest release so the image keeps
# getting a current yt-dlp (YouTube changes often break older versions).
#
# The first push creates the package as private. Make it public once under
# GitHub -> Packages -> tunefin-sidecar -> Package settings -> Change visibility.

name: Sidecar image

on:
  push:
    tags: ["v*"]
  schedule:
    - cron: "17 4 * * 1"   # Mondays 04:17 UTC
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to build, e.g. v1.0.2 (empty = latest release tag)"
        required: false

permissions:
  contents: read
  packages: write

concurrency:
  group: sidecar-image
  cancel-in-progress: false

jobs:
  image:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          fetch-depth: 0

      - name: Work out the tag and image name
        id: v
        run: |
          TAG="${{ inputs.tag }}"
          if [ "${{ github.event_name }}" = "push" ]; then TAG="${{ github.ref_name }}"; fi
          if [ -z "$TAG" ]; then
            TAG=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          fi
          if ! [[ "$TAG" =~ ^v[0-9]+(\.[0-9]+){1,3}$ ]]; then
            echo "No usable version tag (got '$TAG')" >&2; exit 1
          fi
          git checkout --quiet "$TAG"
          IMAGE="ghcr.io/${GITHUB_REPOSITORY_OWNER,,}/tunefin-sidecar"
          TAGS="$IMAGE:${TAG#v}"
          # Only the newest release moves :latest (re-publishing an old tag must not roll it back).
          NEWEST=$(git tag -l 'v*' --sort=-v:refname | head -n1)
          [ "$TAG" = "$NEWEST" ] && TAGS="$TAGS,$IMAGE:latest"
          {
            echo "tag=$TAG"
            echo "tags=$TAGS"
          } >> "$GITHUB_OUTPUT"

      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ github.token }}

      - uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: ytm-sidecar
          platforms: linux/amd64,linux/arm64
          push: true
          # No layer cache: every build installs the newest yt-dlp.
          no-cache: true
          pull: true
          tags: ${{ steps.v.outputs.tags }}
          labels: |
            org.opencontainers.image.source=https://github.com/${{ github.repository }}
            org.opencontainers.image.version=${{ steps.v.outputs.tag }}
            org.opencontainers.image.description=Tunefin sidecar: YouTube Music search, streaming and downloads for the Tunefin Jellyfin plugin
            org.opencontainers.image.licenses=MIT
