# Tunefin: Jellyfin + YouTube Music, complete stack:
#
#   git clone https://github.com/consultomer/Tunefin.git && cd Tunefin
#   cp .env.example .env        # optional: change ports, paths, user
#   docker compose up -d --build
#
# Then open http://<server>:8096, finish the Jellyfin setup wizard, and connect YouTube at
# http://<server>:8096/YouTube  (see README.md).
#
# Already running Jellyfin? Use docker-compose.addon.yml instead (docs/existing-jellyfin.md).

services:
  # One-shot: builds the plugin and copies it into Jellyfin's plugins folder, then exits.
  # Jellyfin waits for it, so the plugin is loaded on the very first start.
  ytm-plugin:
    build: ./Jellyfin.Plugin.YouTubeMusic
    image: jellyfin-ytm-plugin-installer:latest
    restart: "no"
    network_mode: none
    environment:
      SIDECAR_URL: http://ytm-sidecar:8787
      LIBRARY_ROOT_PATH: /media/YouTube     # where Jellyfin sees ${YOUTUBE_PATH}
    volumes:
      - ${JELLYFIN_CONFIG_PATH:-./data/jellyfin/config}/plugins:/plugins

  # Search, streaming and downloads (Node + yt-dlp + ffmpeg). Not exposed outside the compose network.
  ytm-sidecar:
    build: ./ytm-sidecar
    image: ytm-sidecar:latest
    restart: unless-stopped
    # Same user as Jellyfin: it must read the cookies Jellyfin saves (mode 600), and Jellyfin
    # must read the songs it downloads.
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      YOUTUBE_DIR: /youtube
      USER_COOKIES_DIR: /user-cookies
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-10}
      LOG_LEVEL: info
    volumes:
      # Per-user liked libraries + the shared .store. ONE mount, so hardlinks work (no duplicates).
      - ${YOUTUBE_PATH:-./data/youtube}:/youtube
      # Each user's YouTube cookies, saved by the plugin when they connect their account.
      - ${JELLYFIN_CONFIG_PATH:-./data/jellyfin/config}/plugins/Jellyfin.Plugin.YouTubeMusic/users:/user-cookies:ro

  jellyfin:
    image: jellyfin/jellyfin:${JELLYFIN_VERSION:-12.4}
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    ports:
      - "${JELLYFIN_PORT:-8096}:8096"
    environment:
      TZ: ${TZ:-Etc/UTC}
    volumes:
      - ${JELLYFIN_CONFIG_PATH:-./data/jellyfin/config}:/config
      - ${JELLYFIN_CACHE_PATH:-./data/jellyfin/cache}:/cache
      - ${MUSIC_PATH:-./data/music}:/media/Music            # your own music: add it as a "Music" library
      - ${YOUTUBE_PATH:-./data/youtube}:/media/YouTube      # created and managed by the plugin
    depends_on:
      ytm-plugin:
        condition: service_completed_successfully
      ytm-sidecar:
        condition: service_started
