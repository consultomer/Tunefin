# Add YouTube Music to a Jellyfin you ALREADY run (with Docker Compose or plain Docker).
# Full guide: docs/existing-jellyfin.md
#
#   curl -fsSLO https://raw.githubusercontent.com/consultomer/Tunefin/main/docker-compose.addon.yml
#   curl -fsSL  https://raw.githubusercontent.com/consultomer/Tunefin/main/.env.example -o .env
#   # edit .env: PUID/PGID, JELLYFIN_PLUGINS_PATH, YOUTUBE_PATH, JELLYFIN_NETWORK
#   docker compose -f docker-compose.addon.yml up -d
#
# Then install Tunefin from the plugin catalog in Jellyfin. Your Jellyfin container also needs
# ${YOUTUBE_PATH} mounted at /media/YouTube (see the guide).

services:
  ytm-sidecar:
    # To build it from source instead, replace `image:` with `build: ./ytm-sidecar`.
    image: ghcr.io/consultomer/tunefin-sidecar:${TUNEFIN_VERSION:-latest}
    container_name: ytm-sidecar
    restart: unless-stopped
    user: "${PUID:-0}:${PGID:-0}"
    environment:
      YOUTUBE_DIR: /youtube
      USER_COOKIES_DIR: /user-cookies
      MAX_CONCURRENT_DOWNLOADS: ${MAX_CONCURRENT_DOWNLOADS:-10}
      LOG_LEVEL: info
    networks:
      - jellyfin
    volumes:
      - ${YOUTUBE_PATH:?set YOUTUBE_PATH in .env}:/youtube
      # The folder that contains Jellyfin's "plugins" folder:
      #   official image: <config>/plugins     linuxserver image: <config>/data/plugins
      - ${JELLYFIN_PLUGINS_PATH:?set JELLYFIN_PLUGINS_PATH in .env}/Jellyfin.Plugin.YouTubeMusic/users:/user-cookies:ro

networks:
  jellyfin:
    # The Docker network your Jellyfin container is on (docker inspect <jellyfin> -f '{{json .NetworkSettings.Networks}}').
    external: true
    name: ${JELLYFIN_NETWORK:?set JELLYFIN_NETWORK in .env}
